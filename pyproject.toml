[project]
name = "ctrl-browser-agent"
version = "0.1.0"
description = "[CTRL]: a local Jev browser agent for your normal Chrome."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["browser-harness==0.1.13", "httpx[http2]>=0.28,<1", "boto3>=1.40,<2"]

[project.scripts]
ctrl = "ctrl.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ctrl", "jev_ultrafast"]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1"]

[tool.ruff]
line-length = 120
exclude = [".upstream", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
