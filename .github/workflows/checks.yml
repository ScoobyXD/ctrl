name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: uv sync --locked --python 3.12
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File scripts/Debug-CTRL.ps1 -VerifyOnly
      - run: uv build
